<header class="topnav">
  <a class="brand" routerLink="/">
    <span class="logo">◇</span>
    <span class="name">System Design Playground</span>
  </a>
  <nav class="links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/lab" routerLinkActive="active">Lab</a>
    <a routerLink="/sandbox" routerLinkActive="active">Sandbox</a>
  </nav>
  <button
    type="button"
    class="theme-toggle"
    (click)="theme.toggle()"
    [attr.aria-label]="'Switch to ' + (theme.theme() === 'light' ? 'dark' : 'light') + ' theme'"
    title="Toggle theme"
  >
    {{ theme.theme() === 'light' ? '🌙' : '☀️' }}
  </button>
</header>

<main class="app-main">
  <router-outlet />
</main>

<app-toast-host />
